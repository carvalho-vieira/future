<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Future Mirror</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

color:white;

background:linear-gradient(
-45deg,
#050816,
#081B33,
#0B2447,
#19376D
);

background-size:400% 400%;

animation:bg 15s ease infinite;

}


/* =====================================
   FUNDO
===================================== */

@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


/* =====================================
   ÍCONES DAS PROFISSÕES
===================================== */

.background-icons{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:1;

pointer-events:none;

overflow:hidden;

}


/* ÍCONES */

.background-icons span{

position:absolute;

font-size:55px;

opacity:.28;

filter:
drop-shadow(0 0 8px #00B7FF)
drop-shadow(0 0 15px rgba(0,183,255,.5));

user-select:none;

animation:
flutuar 8s ease-in-out infinite;

transition:

transform 1.2s cubic-bezier(.68,-0.55,.27,1.55),

opacity .8s ease,

filter .8s ease;

}


/* =====================================
   MOVIMENTO NORMAL
===================================== */

@keyframes flutuar{

0%{

transform:
translateY(0)
rotate(-5deg);

}

50%{

transform:
translateY(-35px)
rotate(5deg);

}

100%{

transform:
translateY(0)
rotate(-5deg);

}

}


/* =====================================
   POSIÇÕES
===================================== */

.icon1{
top:8%;
left:8%;
}

.icon2{
top:20%;
left:22%;
}

.icon3{
top:10%;
right:12%;
}

.icon4{
top:35%;
right:6%;
}

.icon5{
bottom:15%;
left:8%;
}

.icon6{
bottom:8%;
left:25%;
}

.icon7{
bottom:12%;
right:10%;
}

.icon8{
top:55%;
left:3%;
}

.icon9{
top:7%;
left:48%;
}

.icon10{
bottom:5%;
right:35%;
}

.icon11{
top:45%;
right:25%;
}

.icon12{
bottom:30%;
left:17%;
}


/* =====================================
   ABRINDO O CAMINHO
===================================== */

.abrir-caminho{

animation:none !important;

opacity:0 !important;

filter:
drop-shadow(0 0 30px #00B7FF)
drop-shadow(0 0 60px #00B7FF) !important;

}


/* Cada ícone toma uma direção diferente */

.icon1.abrir-caminho{
transform:translate(-300px,-200px) rotate(-40deg) scale(1.3);
}

.icon2.abrir-caminho{
transform:translate(-400px,0) rotate(-60deg) scale(1.3);
}

.icon3.abrir-caminho{
transform:translate(350px,-200px) rotate(40deg) scale(1.3);
}

.icon4.abrir-caminho{
transform:translate(400px,50px) rotate(60deg) scale(1.3);
}

.icon5.abrir-caminho{
transform:translate(-350px,180px) rotate(-50deg) scale(1.3);
}

.icon6.abrir-caminho{
transform:translate(-150px,300px) rotate(-40deg) scale(1.3);
}

.icon7.abrir-caminho{
transform:translate(350px,220px) rotate(50deg) scale(1.3);
}

.icon8.abrir-caminho{
transform:translate(-350px,80px) rotate(-60deg) scale(1.3);
}

.icon9.abrir-caminho{
transform:translate(0,-300px) rotate(30deg) scale(1.3);
}

.icon10.abrir-caminho{
transform:translate(300px,300px) rotate(50deg) scale(1.3);
}

.icon11.abrir-caminho{
transform:translate(350px,-50px) rotate(60deg) scale(1.3);
}

.icon12.abrir-caminho{
transform:translate(-300px,200px) rotate(-50deg) scale(1.3);
}


/* =====================================
   PAINEL
===================================== */

.overlay{

position:absolute;

width:100%;
height:100%;

backdrop-filter:blur(2px);

z-index:2;

}


.hero{

position:relative;

z-index:5;

padding:20px;

}


.glass{

max-width:750px;

padding:60px;

border-radius:25px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(18px);

text-align:center;

box-shadow:
0 0 40px rgba(0,183,255,.25);

transition:

transform .8s ease,

opacity .8s ease;

}


.glass h3{

color:#65d6ff;

margin-bottom:15px;

letter-spacing:2px;

}


.glass h1{

font-size:55px;

margin-bottom:20px;

}


.glass p{

line-height:1.8;

opacity:.9;

margin-bottom:35px;

}


/* =====================================
   BOTÃO
===================================== */

.btn{

text-decoration:none;

padding:16px 45px;

border-radius:50px;

background:#00B7FF;

color:white;

font-weight:600;

display:inline-block;

transition:.4s;

cursor:pointer;

box-shadow:
0 0 10px rgba(0,183,255,.3);

}


.btn:hover{

transform:translateY(-5px);

box-shadow:
0 0 30px #00B7FF;

}


/* =====================================
   EFEITO NO PAINEL AO CLICAR
===================================== */

.saindo .glass{

transform:scale(1.08);

opacity:0;

}


/* =====================================
   AVATAR
===================================== */

.avatar{

position:fixed;

left:2%;
bottom:0;

z-index:10;

display:flex;
flex-direction:column;
align-items:center;

cursor:pointer;

-webkit-tap-highlight-color:transparent;

transition:
opacity .8s ease,
transform .8s ease;

}

/* Luz suave atrás do avatar */

.avatar::before{

content:"";

position:absolute;

left:50%;
bottom:0;

width:130%;
height:75%;

transform:translateX(-50%);

background:radial-gradient(
ellipse at 50% 60%,
rgba(0,183,255,.30),
transparent 65%
);

z-index:-1;

pointer-events:none;

}

.avatar svg{

display:block;

height:min(64vh,580px);
width:auto;

overflow:visible;

transform-origin:50% 100%;

}

.avatar.pulando svg{

animation:pular .7s ease;

}

@keyframes pular{

0%{ transform:translateY(0) scale(1,1); }

25%{ transform:translateY(8px) scale(1.03,.95); }

55%{ transform:translateY(-38px) scale(.98,1.03); }

80%{ transform:translateY(0) scale(1.02,.97); }

100%{ transform:translateY(0) scale(1,1); }

}


/* BALÃO DE FALA */

.balao{

position:relative;

width:max-content;
max-width:260px;

margin-bottom:14px;

padding:14px 20px;

border-radius:20px;

background:#fff;

color:#0B2447;

font-size:15px;
font-weight:600;
line-height:1.45;
text-align:left;

box-shadow:
0 0 25px rgba(0,183,255,.45),
0 8px 20px rgba(0,0,0,.25);

opacity:0;
transform:translateY(10px) scale(.9);

transition:
opacity .5s ease,
transform .5s cubic-bezier(.68,-0.55,.27,1.55);

}

.balao.visivel{

opacity:1;
transform:translateY(0) scale(1);

}

/* Rabinho do balão apontando para a cabeça */

.balao::after{

content:"";

position:absolute;

left:50%;
bottom:-12px;

transform:translateX(-50%);

border-left:12px solid transparent;
border-right:12px solid transparent;
border-top:14px solid #fff;

}

/* Texto fantasma reserva o tamanho do balão, o texto digitado fica por cima */

.balao .fantasma{

display:block;

visibility:hidden;

}

.balao .digitado{

position:absolute;

left:20px;
right:20px;
top:14px;

}

.balao .cursor{

display:none;

width:2px;
height:1em;

margin-left:2px;

background:#00B7FF;

vertical-align:-2px;

animation:piscar .7s steps(1) infinite;

}

.balao.digitando .cursor{

display:inline-block;

}

@keyframes piscar{

50%{ opacity:0; }

}


/* Avatar some ao clicar em COMEÇAR */

.saindo .avatar{

opacity:0;

transform:translateX(-60px);

pointer-events:none;

}


/* =====================================
   TELAS MÉDIAS
===================================== */

@media(max-width:1100px) and (min-width:769px){

.avatar svg{

height:min(50vh,440px);

}

}


/* =====================================
   CELULAR
===================================== */

@media(max-width:768px){

.background-icons span{

font-size:38px;

opacity:.22;

}


/* Movimentos menores no celular */

.icon1.abrir-caminho{
transform:translate(-150px,-120px) rotate(-40deg);
}

.icon2.abrir-caminho{
transform:translate(-180px,0) rotate(-50deg);
}

.icon3.abrir-caminho{
transform:translate(180px,-120px) rotate(40deg);
}

.icon4.abrir-caminho{
transform:translate(180px,80px) rotate(50deg);
}

.icon5.abrir-caminho{
transform:translate(-180px,120px) rotate(-40deg);
}

.icon6.abrir-caminho{
transform:translate(-100px,180px) rotate(-40deg);
}

.icon7.abrir-caminho{
transform:translate(180px,150px) rotate(40deg);
}

.icon8.abrir-caminho{
transform:translate(-180px,50px) rotate(-50deg);
}

.icon9.abrir-caminho{
transform:translate(0,-180px) rotate(30deg);
}

.icon10.abrir-caminho{
transform:translate(150px,180px) rotate(40deg);
}

.icon11.abrir-caminho{
transform:translate(180px,-30px) rotate(50deg);
}

.icon12.abrir-caminho{
transform:translate(-160px,130px) rotate(-40deg);
}


.glass{

padding:35px;

margin:20px;

}

.glass h1{

font-size:36px;

}

.glass p{

font-size:15px;

}

/* Avatar menor, no canto inferior direito */

.avatar{

left:auto;
right:3%;

}

.avatar svg{

height:34vh;

}

.balao{

max-width:200px;

font-size:13px;

padding:10px 14px;

}

.balao .digitado{

left:14px;
right:14px;
top:10px;

}

}


/* =====================================
   TRANSIÇÃO PARA A CÂMERA
===================================== */

body.transicao{

animation:none;

background:#000814;

}

</style>

</div>


<script>


// =====================================
// TEXTO DIGITANDO
// =====================================

const texto="Espelho do Futuro";

let i=0;

function escrever(){

if(i<texto.length){

document.getElementById("typing").innerHTML+=
texto.charAt(i);

i++;

setTimeout(escrever,120);

}

}

escrever();


// =====================================
// MOVIMENTO DOS ÍCONES
// =====================================

const icons=
document.querySelectorAll(
".background-icons span"
);

icons.forEach((icon,index)=>{

icon.style.animationDelay=
(index * -0.7)+"s";

});


// =====================================
// AVATAR
// =====================================

const $=id=>document.getElementById(id);

const avatar=$("avatar");
const avatarSvg=$("avatarSvg");
const balao=$("balao");
const balaoTexto=$("balaoTexto");
const fantasma=$("fantasma");

const cabeca=$("cabeca");
const corpo=$("corpo");
const irisE=$("irisE");
const irisD=$("irisD");
const palpE=$("palpE");
const palpD=$("palpD");
const cilioE=$("cilioE");
const cilioD=$("cilioD");
const sobrancelhas=$("sobrancelhas");
const bocaInterior=$("bocaInterior");
const labioInf=$("labioInf");
const bracoD=$("bracoD");
const antebracoD=$("antebracoD");
const bracoE=$("bracoE");
const antebracoE=$("antebracoE");


// ---------- Cabelo crespo (gerado com cachinhos) ----------

const NS="http://www.w3.org/2000/svg";

function gerador(seed){

return function(){

seed|=0;
seed=seed+0x6D2B79F5|0;

let t=Math.imul(seed^seed>>>15,1|seed);

t=t+Math.imul(t^t>>>7,61|t)^t;

return((t^t>>>14)>>>0)/4294967296;

};

}

function linhaDoCabelo(x){

return 44-15*Math.exp(-Math.pow((x-120)/30,2));

}

function fazerCabelo(){

const R=gerador(11);

const tras=$("cabeloTras");
const frente=$("cabeloFrente");

const cores=["#1b100b","#140b07","#251710","#0f0805","#2d1d14","#1a0e09"];

function cor(){
return cores[Math.floor(R()*cores.length)];
}

function circulo(g,x,y,r,fill,op,stroke){

const c=document.createElementNS(NS,"circle");

c.setAttribute("cx",x.toFixed(1));
c.setAttribute("cy",y.toFixed(1));
c.setAttribute("r",r.toFixed(1));

if(stroke){

c.setAttribute("fill","none");
c.setAttribute("stroke",stroke);
c.setAttribute("stroke-width","0.8");

}else{

c.setAttribute("fill",fill);

}

if(op!==undefined){
c.setAttribute("opacity",op);
}

g.appendChild(c);

}

function naFrente(x,y){

if(Math.abs(x-120)<=34){
return y<linhaDoCabelo(x);
}

return y<62;

}

// volume principal
for(let n=0;n<280;n++){

const a=R()*Math.PI*2;
const d=Math.sqrt(R());

const x=120+Math.cos(a)*d*57;
const y=46+Math.sin(a)*d*40;

if(y>74) continue;

const r=8+R()*5;

circulo(tras,x,y,r,cor());

if(naFrente(x,y)){
circulo(frente,x,y,r*.85,cor());
}

}

// preenchimento denso acima da testa
for(let x=80;x<=160;x+=4){

for(let y=12;y<linhaDoCabelo(x);y+=4){

circulo(frente,x+R()*3-1.5,y+R()*3-1.5,5+R()*3,cor());

}

}

// laterais (costeletas / têmporas)
for(let y=40;y<=66;y+=4){

circulo(frente,88.5+R()*2,y,3.4+R()*1.5,cor());
circulo(frente,151.5-R()*2,y,3.4+R()*1.5,cor());

}

// borda irregular da linha do cabelo (cachinhos)
for(let x=84;x<=156;x+=3){

circulo(frente,x,linhaDoCabelo(x)+R()*3-1,3.2+R()*2,cor());

}

// brilho e textura de cachos
for(let n=0;n<70;n++){

const a=R()*Math.PI*2;
const d=Math.sqrt(R());

const x=120+Math.cos(a)*d*54;
const y=44+Math.sin(a)*d*34;

if(y>60) continue;

circulo(frente,x,y,3+R()*3,"#4a3326",.18+R()*.15);

}

for(let n=0;n<110;n++){

const a=R()*Math.PI*2;
const d=Math.sqrt(R());

const x=120+Math.cos(a)*d*55;
const y=44+Math.sin(a)*d*36;

if(y>66) continue;

circulo(frente,x,y,2.6+R()*2.4,null,.35,"#43301f");

}

}

fazerCabelo();


// ---------- Frases do balão (aparecem sozinhas, em sequência) ----------

const frases=[
"Sejam bem-vindos ao Espelho do Futuro!",
"Eu sou o seu guia nesta viagem pelas profissões!",
"Aqui você vai descobrir qual carreira combina com o seu perfil.",
"Vamos usar tecnologia e inteligência artificial para isso!",
"Sorria para a câmera: o espelho vai te conhecer.",
"Clique em COMEÇAR e descubra o seu futuro!"
];

let idxFrase=0;
let ativo=true;
let falando=false;
let acenando=false;
let timer=null;
let timerAceno=null;

function mostrarFrase(){

if(!ativo) return;

const f=frases[idxFrase];

fantasma.textContent=f;

balaoTexto.textContent="";

balao.classList.add("visivel","digitando");

falando=true;

let n=0;

(function digitar(){

if(!ativo) return;

if(n<f.length){

const letra=f.charAt(n);

balaoTexto.textContent+=letra;

// a boca acompanha as letras
bocaAlvo=(letra===" "||letra===","||letra==="."||letra==="!")?
.08 : .35+Math.random()*.65;

n++;

timer=setTimeout(digitar,48);

}else{

falando=false;

bocaAlvo=0;

balao.classList.remove("digitando");

// fica lendo um tempo e passa para a próxima frase sozinho

timer=setTimeout(()=>{

balao.classList.remove("visivel");

timer=setTimeout(()=>{

idxFrase=(idxFrase+1)%frases.length;

mostrarFrase();

},650);

},2800);

}

})();

}

function acenar(ms){

acenando=true;

clearTimeout(timerAceno);

timerAceno=setTimeout(()=>{
acenando=false;
},ms);

}

// Começa sozinho ao abrir o site

acenar(6000);

setTimeout(mostrarFrase,900);


// Clicar no avatar: pula, acena e vai para a próxima frase

avatar.addEventListener("click",()=>{

avatar.classList.remove("pulando");

void avatar.offsetWidth;

avatar.classList.add("pulando");

acenar(2800);

clearTimeout(timer);

falando=false;
bocaAlvo=0;

idxFrase=(idxFrase+1)%frases.length;

balao.classList.remove("visivel","digitando");

timer=setTimeout(mostrarFrase,250);

});


// ---------- Olhar seguindo o mouse / dedo ----------

let alvoOlhoX=0,alvoOlhoY=0;
let olhoX=0,olhoY=0;

function olharPara(x,y){

const r=avatarSvg.getBoundingClientRect();

const cx=r.left+r.width*.5;
const cy=r.top+r.height*.115;

let dx=(x-cx)/(window.innerWidth/2);
let dy=(y-cy)/(window.innerHeight/2);

alvoOlhoX=Math.max(-1,Math.min(1,dx));
alvoOlhoY=Math.max(-1,Math.min(1,dy));

}

document.addEventListener("mousemove",e=>{
olharPara(e.clientX,e.clientY);
});

document.addEventListener("touchmove",e=>{
const t=e.touches[0];
olharPara(t.clientX,t.clientY);
},{passive:true});

// olhar inicial: para o centro da tela

olharPara(window.innerWidth/2,window.innerHeight/2);


// ---------- Animação contínua (respirar, piscar, falar, acenar) ----------

let sh=-2,el=-4;
let bocaV=0,bocaAlvo=0;
let proxPisca=2000,iniPisca=-1;

function tick(t){

// olhos
olhoX+=(alvoOlhoX-olhoX)*.12;
olhoY+=(alvoOlhoY-olhoY)*.12;

const tr="translate("+(olhoX*2.2).toFixed(2)+" "+(olhoY*1.4).toFixed(2)+")";

irisE.setAttribute("transform",tr);
irisD.setAttribute("transform",tr);

// piscar
let pisca=0;

if(iniPisca<0 && t>proxPisca){
iniPisca=t;
}

if(iniPisca>=0){

const d=t-iniPisca;

if(d<180){

pisca=Math.sin(Math.PI*d/180);

}else{

iniPisca=-1;

proxPisca=t+2200+Math.random()*3000;

}

}

const h=(pisca*19).toFixed(2);

palpE.setAttribute("height",h);
palpD.setAttribute("height",h);

const fechado=pisca>.7?1:0;

cilioE.setAttribute("opacity",fechado);
cilioD.setAttribute("opacity",fechado);

// boca
bocaV+=(bocaAlvo-bocaV)*.35;

bocaInterior.setAttribute(
"transform",
"translate(0 92.6) scale(1 "+bocaV.toFixed(3)+") translate(0 -92.6)"
);

bocaInterior.setAttribute("opacity",bocaV>.03?1:0);

labioInf.setAttribute(
"transform",
"translate(0 "+(bocaV*7).toFixed(2)+")"
);

// braços
const alvoSh=acenando?-55:-2;

const alvoEl=acenando?-125+Math.sin(t/110)*17:-4;

sh+=(alvoSh-sh)*.08;

el+=(alvoEl-el)*(acenando?.2:.08);

bracoD.setAttribute("transform","rotate("+sh.toFixed(2)+" 174 148)");

antebracoD.setAttribute("transform","rotate("+el.toFixed(2)+" 174 214)");

const sw=Math.sin(t/1300)*1.2;

bracoE.setAttribute("transform","rotate("+sw.toFixed(2)+" 66 148)");

antebracoE.setAttribute("transform","rotate("+(2-sw*.6).toFixed(2)+" 66 214)");

// corpo respirando
corpo.setAttribute(
"transform",
"translate(0 "+(Math.sin(t/900)*.9).toFixed(2)+")"
);

// cabeça: leve balanço, acompanha o olhar e balança ao falar
const bob=falando?Math.sin(t/170)*.7:0;

const ang=Math.sin(t/2100)*1.1+olhoX*3.2;

cabeca.setAttribute(
"transform",
"translate(0 "+bob.toFixed(2)+") rotate("+ang.toFixed(2)+" 120 106)"
);

// sobrancelhas sobem ao falar e ao acenar
sobrancelhas.setAttribute(
"transform",
"translate(0 "+(-bocaV*1.2-(acenando?1.2:0)).toFixed(2)+")"
);

requestAnimationFrame(tick);

}

requestAnimationFrame(tick);


// =====================================
// ABRIR CAMINHO
// =====================================

const botao=
document.getElementById("começar");

botao.addEventListener("click",function(event){

// Impede a página de mudar imediatamente

event.preventDefault();


// Para o avatar de falar

ativo=false;

clearTimeout(timer);

balao.classList.remove("visivel");


// Ativa o movimento

icons.forEach(icon=>{

icon.classList.add("abrir-caminho");

});


// Faz o painel desaparecer

document.body.classList.add("saindo");


// Escurece o fundo

setTimeout(()=>{

document.body.classList.add("transicao");

},500);


// Vai para o scanner

setTimeout(()=>{

window.location.href="camera.html";

},1200);

});

</script>
