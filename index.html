<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Future Mirror</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

color:white;

background:linear-gradient(
-45deg,
#050816,
#081B33,
#0B2447,
#19376D
);

background-size:400% 400%;

animation:bg 15s ease infinite;

}


/* =====================================
   FUNDO
===================================== */

@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


/* =====================================
   ÍCONES DAS PROFISSÕES
===================================== */

.background-icons{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:1;

pointer-events:none;

overflow:hidden;

}


/* ÍCONES */

.background-icons span{

position:absolute;

font-size:55px;

opacity:.28;

filter:
drop-shadow(0 0 8px #00B7FF)
drop-shadow(0 0 15px rgba(0,183,255,.5));

user-select:none;

animation:
flutuar 8s ease-in-out infinite;

transition:

transform 1.2s cubic-bezier(.68,-0.55,.27,1.55),

opacity .8s ease,

filter .8s ease;

}


/* =====================================
   MOVIMENTO NORMAL
===================================== */

@keyframes flutuar{

0%{

transform:
translateY(0)
rotate(-5deg);

}

50%{

transform:
translateY(-35px)
rotate(5deg);

}

100%{

transform:
translateY(0)
rotate(-5deg);

}

}


/* =====================================
   POSIÇÕES
===================================== */

.icon1{
top:8%;
left:8%;
}

.icon2{
top:20%;
left:22%;
}

.icon3{
top:10%;
right:12%;
}

.icon4{
top:35%;
right:6%;
}

.icon5{
bottom:15%;
left:8%;
}

.icon6{
bottom:8%;
left:25%;
}

.icon7{
bottom:12%;
right:10%;
}

.icon8{
top:55%;
left:3%;
}

.icon9{
top:7%;
left:48%;
}

.icon10{
bottom:5%;
right:35%;
}

.icon11{
top:45%;
right:25%;
}

.icon12{
bottom:30%;
left:17%;
}


/* =====================================
   ABRINDO O CAMINHO
===================================== */

.abrir-caminho{

animation:none !important;

opacity:0 !important;

filter:
drop-shadow(0 0 30px #00B7FF)
drop-shadow(0 0 60px #00B7FF) !important;

}


/* Cada ícone toma uma direção diferente */

.icon1.abrir-caminho{
transform:translate(-300px,-200px) rotate(-40deg) scale(1.3);
}

.icon2.abrir-caminho{
transform:translate(-400px,0) rotate(-60deg) scale(1.3);
}

.icon3.abrir-caminho{
transform:translate(350px,-200px) rotate(40deg) scale(1.3);
}

.icon4.abrir-caminho{
transform:translate(400px,50px) rotate(60deg) scale(1.3);
}

.icon5.abrir-caminho{
transform:translate(-350px,180px) rotate(-50deg) scale(1.3);
}

.icon6.abrir-caminho{
transform:translate(-150px,300px) rotate(-40deg) scale(1.3);
}

.icon7.abrir-caminho{
transform:translate(350px,220px) rotate(50deg) scale(1.3);
}

.icon8.abrir-caminho{
transform:translate(-350px,80px) rotate(-60deg) scale(1.3);
}

.icon9.abrir-caminho{
transform:translate(0,-300px) rotate(30deg) scale(1.3);
}

.icon10.abrir-caminho{
transform:translate(300px,300px) rotate(50deg) scale(1.3);
}

.icon11.abrir-caminho{
transform:translate(350px,-50px) rotate(60deg) scale(1.3);
}

.icon12.abrir-caminho{
transform:translate(-300px,200px) rotate(-50deg) scale(1.3);
}


/* =====================================
   PAINEL
===================================== */

.overlay{

position:absolute;

width:100%;
height:100%;

backdrop-filter:blur(2px);

z-index:2;

}


.hero{

position:relative;

z-index:5;

padding:20px;

}


.glass{

max-width:750px;

padding:60px;

border-radius:25px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(18px);

text-align:center;

box-shadow:
0 0 40px rgba(0,183,255,.25);

transition:

transform .8s ease,

opacity .8s ease;

}


.glass h3{

color:#65d6ff;

margin-bottom:15px;

letter-spacing:2px;

}


.glass h1{

font-size:55px;

margin-bottom:20px;

}


.glass p{

line-height:1.8;

opacity:.9;

margin-bottom:35px;

}


/* =====================================
   BOTÃO
===================================== */

.btn{

text-decoration:none;

padding:16px 45px;

border-radius:50px;

background:#00B7FF;

color:white;

font-weight:600;

display:inline-block;

transition:.4s;

cursor:pointer;

box-shadow:
0 0 10px rgba(0,183,255,.3);

}


.btn:hover{

transform:translateY(-5px);

box-shadow:
0 0 30px #00B7FF;

}


/* =====================================
   EFEITO NO PAINEL AO CLICAR
===================================== */

.saindo .glass{

transform:scale(1.08);

opacity:0;

}


/* =====================================
   TRANSIÇÃO PARA A CÂMERA
===================================== */

body.transicao{

animation:none;

background:#000814;

}

</style>

</head>


<body>


<!-- =====================================
     PROFISSÕES
===================================== -->

<div class="background-icons">

<span class="icon1">🩺</span>

<span class="icon2">⚖️</span>

<span class="icon3">💻</span>

<span class="icon4">👨‍⚕️</span>

<span class="icon5">👩‍🏫</span>

<span class="icon6">📚</span>

<span class="icon7">🧪</span>

<span class="icon8">⚙️</span>

<span class="icon9">🏗️</span>

<span class="icon10">✈️</span>

<span class="icon11">📷</span>

<span class="icon12">🎨</span>

</div>


<div class="overlay"></div>


<section class="hero">

<div class="glass">

<h3>FEIRA DAS PROFISSÕES</h3>

<h1 id="typing"></h1>

<p>

Descubra qual profissão combina com seu perfil através de uma experiência interativa utilizando tecnologia e inteligência artificial.

</p>

<a href="camera.html" class="btn" id="começar">

COMEÇAR

</a>

</div>

</section>


<script>


// =====================================
// TEXTO DIGITANDO
// =====================================

const texto="Espelho do Futuro";

let i=0;

function escrever(){

if(i<texto.length){

document.getElementById("typing").innerHTML+=
texto.charAt(i);

i++;

setTimeout(escrever,120);

}

}

escrever();


// =====================================
// MOVIMENTO DOS ÍCONES
// =====================================

const icons=
document.querySelectorAll(
".background-icons span"
);

icons.forEach((icon,index)=>{

icon.style.animationDelay=
(index * -0.7)+"s";

});


// =====================================
// ABRIR CAMINHO
// =====================================

const botao=
document.getElementById("começar");

botao.addEventListener("click",function(event){

// Impede a página de mudar imediatamente

event.preventDefault();


// Ativa o movimento

icons.forEach(icon=>{

icon.classList.add("abrir-caminho");

});


// Faz o painel desaparecer

document.body.classList.add("saindo");


// Escurece o fundo

setTimeout(()=>{

document.body.classList.add("transicao");

},500);


// Vai para o scanner

setTimeout(()=>{

window.location.href="camera.html";

},1200);

});

</script>


</body>

</html>
